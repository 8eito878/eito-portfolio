<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eito Matsuo</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#111111;
    --gray:#999999;
    --line:#E8E8E8;
    --sans:'Inter','Zen Kaku Gothic New',sans-serif;
    --jp:'Zen Kaku Gothic New',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:10px;font-weight:400;
    letter-spacing:.08em;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;}

  #loader{
    position:fixed;inset:0;background:var(--bg);z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;transition:opacity .6s ease;
  }
  #loader.done{opacity:0;pointer-events:none;}
  #loader .pct{letter-spacing:.18em;}
  #loader .bar{width:120px;height:1px;background:var(--line);position:relative;overflow:hidden;}
  #loader .bar i{
    position:absolute;inset:0;background:var(--ink);
    transform:scaleX(0);transform-origin:left;display:block;
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;text-transform:uppercase;
  }
  header .left,header .right{display:flex;gap:24px;}
  .nav-link{position:relative;padding:4px 0;}
  .nav-link::after{
    content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;
    background:var(--ink);transform:scaleX(0);transform-origin:right;
    transition:transform .3s ease;
  }
  .nav-link:hover::after,.nav-link.on::after{transform:scaleX(1);transform-origin:left;}

  .view{display:none;}
  .view.active{display:block;}
  #work,#contact{position:relative;z-index:1;background:var(--bg);min-height:100svh;}
  #about{position:fixed;inset:0;z-index:1;background:var(--bg);overflow:hidden;}
  #app{transition:opacity .28s ease;}
  #app.fading{opacity:0;}

  /* ---------- landing (hero + works as one vertical page) ---------- */
  #landing{position:fixed;inset:0;overflow:hidden;background:var(--bg);}
  #landing.view:not(.active){display:none!important;}
  #heroPane{
    position:absolute;left:0;top:0;width:100%;height:100%;
    background:#FFFFFF;display:flex;align-items:center;justify-content:center;
    transform:translateY(calc(var(--p,0) * -60%));
    opacity:calc(1 - var(--p,0)*1.7);
    will-change:transform,opacity;
  }
  #worksPane{
    position:absolute;left:0;top:0;width:100%;height:100%;
    background:var(--bg);
    transform:translateY(calc((1 - var(--p,0)) * 100%));
    will-change:transform;
  }
  .scrollhint{
    position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);
    opacity:calc(1 - var(--p,0)*2.4);
  }
  .scrollhint::before{content:'( ';}
  .scrollhint::after{content:' )';}
  #specwrap{width:min(48vw,750px);aspect-ratio:3.2/1;}
  #bee{width:100%;height:100%;display:block;border-radius:2px;}
  @media (max-width:640px){#specwrap{width:66vw;aspect-ratio:3/1;}}

  #gl{position:absolute;inset:0;display:block;cursor:grab;}
  #gl.grabbing{cursor:grabbing;}
  #focusTitle{
    position:absolute;z-index:5;transform:translateX(-50%);
    text-transform:uppercase;font-weight:500;letter-spacing:.16em;
    white-space:nowrap;pointer-events:none;opacity:0;
  }
  .home-label{
    position:fixed;bottom:16px;left:20px;z-index:40;
    color:var(--gray);letter-spacing:.12em;text-transform:uppercase;
  }

  .plate{
    min-height:100svh;position:relative;
    display:flex;align-items:center;justify-content:center;
    border-top:1px solid var(--line);
  }
  .plate:first-child{border-top:0;}
  .corner{position:absolute;text-transform:uppercase;letter-spacing:.12em;font-size:10px;}
  .corner.tl{top:84px;left:20px;}
  .corner.bl{bottom:22px;left:20px;}
  .corner.br{bottom:22px;right:20px;text-align:right;}
  .corner .sub{color:var(--gray);margin-top:4px;display:block;}

  .p-title{flex-direction:column;}
  .p-title h1{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-align:center;}
  .p-title .cat{margin-top:10px;color:var(--gray);text-transform:uppercase;text-align:center;}
  .metaline{
    position:absolute;left:20px;right:20px;top:50%;margin-top:90px;
    display:flex;justify-content:space-between;align-items:baseline;
    text-transform:uppercase;letter-spacing:.1em;flex-wrap:wrap;gap:14px;
  }
  .metaline span b{font-weight:400;color:var(--gray);margin-right:8px;}
  .metaline span{white-space:nowrap;}
  .metaline span::after{content:'\00a0\00a0)';color:var(--gray);}
  .p-title .jp{
    position:absolute;left:20px;bottom:80px;
    font-family:var(--jp);font-size:11px;letter-spacing:.06em;
    line-height:2.1;max-width:300px;text-align:justify;text-align-last:left;
  }

  .p-img figure{display:flex;align-items:center;justify-content:center;max-width:62vw;max-height:52vh;}
  .p-img img{
    max-width:62vw;max-height:52vh;width:auto;height:auto;background:#F4F4F4;
    opacity:0;transform:translateY(14px);
    transition:opacity .9s ease,transform .9s cubic-bezier(.22,1,.36,1);
  }
  .p-img img.in{opacity:1;transform:none;}
  .p-img .ph{width:50vw;aspect-ratio:16/10;background:#F4F4F4;}
  .p-img.big figure,.p-img.big img{max-width:98vw;max-height:148vh;}

  .p-next{gap:clamp(110px,20vw,220px);flex-wrap:wrap;padding:0 20px;}
  .p-next a{display:flex;flex-direction:column;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.16em;}
  .p-next a .lbl{color:var(--gray);}
  .p-next a .t{font-weight:500;position:relative;padding:4px 0;}
  .p-next a .t::after{
    content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;
    background:var(--ink);transform:scaleX(0);transform-origin:right;
    transition:transform .3s ease;
  }
  .p-next a:hover .t::after{transform:scaleX(1);transform-origin:left;}

  .aboutwrap{
    height:100svh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    padding:90px 20px;gap:34px;
  }
  .aboutwrap .name{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:11px;}
  .aboutwrap .bio{line-height:2.2;letter-spacing:.1em;text-transform:uppercase;max-width:420px;}
  .aboutwrap .links{display:flex;gap:30px;text-transform:uppercase;}
  .aboutwrap .links a{position:relative;padding:4px 0;}
  .aboutwrap .links a::after{
    content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;
    background:var(--ink);transform:scaleX(0);transform-origin:right;
    transition:transform .3s ease;
  }
  .aboutwrap .links a:hover::after{transform:scaleX(1);transform-origin:left;}
  .aboutwrap .copy{color:var(--gray);letter-spacing:.12em;}

  /* ---------- frog trail (about, bottom-right) ---------- */
  /* カエルの足跡: 一旦非表示。戻すときは display:none を消すだけ */
  #frogtrail{display:none;position:absolute;right:0;bottom:0;width:320px;height:320px;pointer-events:none;z-index:6;}

  /* ---------- contact (About と同じ文字設計) ---------- */
  #contact{position:relative;overflow:hidden;}
  #ladybug{
    position:absolute;top:0;left:0;z-index:0;width:30px;height:30px;
    pointer-events:none;visibility:hidden;
    background-image:url('/img/img-01.avif');
    background-repeat:no-repeat;
    background-size:2400% 100%;                 /* 24コマ */
    background-position:calc(var(--f,0) * (100% / 23)) 0;
    transform:translate(-50%,-50%) translate(var(--lx,-9999px),var(--ly,-9999px)) rotate(var(--lr,0deg));
    transition:transform .12s linear;
    will-change:transform,background-position;
  }
  #ladybug.live{visibility:visible;}
  .contactwrap{position:relative;z-index:1;}
  .contactwrap{
    min-height:100svh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    max-width:420px;margin:0 auto;padding:120px 20px 80px;gap:30px;
  }
  .c-tag{text-transform:uppercase;letter-spacing:.18em;color:var(--gray);font-size:11px;}
  .c-title{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:11px;line-height:1.6;}
  .c-sub{line-height:2.2;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--ink);max-width:420px;}
  .c-form{display:flex;flex-direction:column;gap:18px;width:100%;max-width:300px;text-align:left;}
  .c-field{display:flex;flex-direction:column;gap:7px;}
  .c-field span{text-transform:uppercase;letter-spacing:.14em;color:var(--gray);font-size:11px;}
  .c-field input,.c-field textarea{
    font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:9px 0;resize:none;text-align:center;
  }
  .c-msg textarea{border-bottom:0;}
  .c-field input::placeholder,.c-field textarea::placeholder{color:#C8C4B8;text-transform:uppercase;letter-spacing:.1em;}
  .c-submit{
    margin-top:6px;align-self:center;
    font-size:11px;text-transform:uppercase;letter-spacing:.18em;
    background:transparent;color:var(--ink);border:0;padding:8px 0;cursor:not-allowed;
    position:relative;
  }
  .c-submit::after{content:'';position:absolute;left:0;bottom:2px;height:1px;width:100%;background:var(--ink);opacity:.4;}
  .c-note{letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--gray);}
  .c-alt{display:flex;flex-direction:column;gap:12px;align-items:center;
    text-transform:uppercase;letter-spacing:.14em;font-size:11px;}
  .c-alt a{position:relative;padding:4px 0;}
  .c-alt a::after{
    content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;
    background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .3s ease;
  }
  .c-alt a:hover::after{transform:scaleX(1);transform-origin:left;}
  .c-mail{color:var(--gray);}
  .aboutwrap .pframe{width:120px;overflow:hidden;}
  .aboutwrap .pframe img{width:100%;height:auto;display:block;}
  .nav-link.contact-btn,.links a.inert{cursor:pointer;}

  /* ---------- about: cursor stickers ---------- */
  #stickerLayer{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;}
  .sticker{
    position:absolute;width:auto;height:auto;
    max-width:56px;max-height:56px;          /* 全ステッカーを最小サイズに統一 */
    transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.5);
    opacity:0;will-change:transform,opacity;
    transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .35s ease;
  }
  .sticker.on{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1);}
  .sticker.off{opacity:0;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.85);}

  .p-video{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);min-height:100svh;}
  .p-video video{max-width:62vw;max-height:52vh;width:auto;height:auto;}

  @media (max-width:640px){
    .p-video video{max-width:86vw;max-height:46vh;}
    .corner.tl{top:70px;left:16px;}
    .corner.bl{left:16px;}
    .corner.br{right:16px;}
    .corner{font-size:9px;}
    .p-img img,.p-img figure{max-width:86vw;max-height:46vh;}
    .p-img.big img,.p-img.big figure{max-width:100vw;max-height:132vh;}
    .p-title .jp{max-width:78vw;bottom:96px;left:16px;}
    .metaline{margin-top:70px;left:16px;right:16px;}
    header{padding:12px 16px;}
    header .left,header .right{gap:16px;}
    .home-label{left:16px;}
    .p-next{flex-direction:column;align-items:center;gap:36px;}
    .aboutwrap{padding:80px 20px;}
    .aboutwrap .bio{font-size:10px;}
    .aboutwrap .links{gap:20px;}
    .contactwrap{padding:90px 20px 60px;}
    .c-form{max-width:100%;}
  }
  @media (max-width:390px){
    header .left,header .right{gap:12px;}
    .metaline{font-size:9px;gap:8px;}
    .p-next{gap:28px;}
  }
</style>
</head>
<body>

<div id="loader">
  <div class="pct" id="pct">001</div>
  <div class="bar"><i id="bar"></i></div>
</div>

<header>
  <div class="left"><a class="nav-link" data-go="landing" href="#/">Eito</a></div>
  <div class="right">
    <a class="nav-link" data-go="about" href="#/about">About</a>
    <a class="nav-link" data-go="contact" href="#/contact">Contact</a>
  </div>
</header>

<div id="app">
  <section class="view active" id="landing">
    <div id="heroPane">
      <div id="specwrap"><canvas id="bee"></canvas></div>
      <div class="scrollhint">scroll</div>
    </div>
    <div id="worksPane">
      <canvas id="gl"></canvas>
      <div id="focusTitle"></div>
      <div class="home-label">Works 2023 — 2026</div>
    </div>
  </section>

  <section class="view" id="work"><div id="detail"></div></section>

  <section class="view" id="about">
    <div id="stickerLayer"></div>
    <div class="aboutwrap">
      <div class="pframe"><img src="https://framerusercontent.com/images/1Sgq6ptB89ESGAyEwdv8B18mgAk.jpg?width=400" alt="Eito Matsuo" onerror="this.parentNode.style.display='none'"></div>
      <p class="name">Eito Matsuo</p>
      <p class="bio">
        Japan-born, Tokyo-based student designer.<br>
        Working across product, graphic<br>and spatial design.
      </p>
      <div class="links">
        <a href="https://www.instagram.com/eixo.m/" target="_blank" rel="noopener">Instagram</a>
        <a class="inert">Email</a>
      </div>
      <p class="copy">©2026 Eito Matsuo</p>
    </div>
    <div id="frogtrail"></div>
  </section>

  <section class="view" id="contact">
    <div id="ladybug"></div>
    <div class="contactwrap">
      <span class="c-tag">Contact</span>
      <div class="c-form">
        <label class="c-field"><span>Name</span><input type="text" placeholder="山田 太郎" disabled></label>
        <label class="c-field"><span>Email</span><input type="email" placeholder="you@example.com" disabled></label>
        <label class="c-field"><span>Phone</span><input type="tel" placeholder="090-1234-5678" disabled></label>
        <label class="c-field c-msg"><span>Message</span><textarea rows="4" placeholder="お問い合わせ内容をご記入ください" disabled></textarea></label>
        <button class="c-submit" disabled>Send message</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const F='https://framerusercontent.com/images/';
/* thumb: 埋め込み画像 / asp: 画像の縦横比(幅/高さ) */
const WORKS=[

   images:['oZPNw3sEEIzoQ5CKFBV4RlppU.png?width=2000','1KSPRKh5tdGXP5TWrMdFaHfWr0.png?width=1400','VQbT0ojRaVW3b7f6ujFRd9Eyrpc.png?width=1400','ihGn5koe45KJ6gI2BOUKnlEc0yA.png?width=2000'],

  {slug:'dialectic',title:'DIALECTIC',cat:'Graphic design',year:'2025',

  {slug:'pictogram',title:'Pictogram',cat:'Information design',year:'2024',

   desc:'本作品は、高級感のある海外食材や珍しい野菜を扱うスーパーマーケットを想定したピクトグラムデザインである。料理好きや珍しい食材に関心のある客層を対象とし、店内での視認性とブランドイメージの統一を図ることを意図した。すべてを同一の四角形グリッドで構成し、簡潔な形状により食材の個性を表現することで、統一感と判別性の両立を目指した。',
   meta:{year:'2024',size:'-',tools:'Illustrator',schedule:'-'}},
  {slug:'wabi-sabi',title:'Wabi-Sabi',cat:'Spatial design',year:'2025',

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,mi,ma)=>Math.min(ma,Math.max(mi,v));
const app=document.getElementById('app');

/* 縦スクロール状態: 0=ハチ(トップ) / 1=ワーク。ホイールで変化 */
const landing=views.landing;
let landP=0,landTP=0;          // current / target

let settleTimer=null;
function landingActive(){return landing.classList.contains('active');}
function onHero(){return landTP<0.5;}
function onWorks(){return landTP>=0.999;}
addEventListener('wheel',e=>{
  if(!landingActive())return;
  if(onWorks()){
    // ワーク面: 下=横送り(到達直後のひと回しは無視) / 上=トップへ
    if(e.deltaY>0){ if(worksSettled) tScroll+=e.deltaY*0.5; }
    else landTP=clamp(landTP+e.deltaY*0.0036,0,1);
  }else{
    landTP=clamp(landTP+e.deltaY*0.0036,0,1);
  }
},{passive:true});
/* タッチ: 縦スワイプでpを動かす(ワーク横はドラッグ系で別処理) */
let ltY=null;

landing.addEventListener('touchmove',e=>{
  if(ltY==null)return;
  const y=e.touches[0].clientY,dy=ltY-y;
  if(!dragging){
    if(onWorks()){
      if(dy>0){ if(worksSettled) tScroll+=dy*0.9; }   // 下スワイプで横送り(到達直後は無視)
      else landTP=clamp(landTP+dy*0.003,0,1);           // 上スワイプでハチへ
    }else{
      landTP=clamp(landTP+dy*0.003,0,1);

},{passive:true});

  if(ltY!==null&&landTP>0&&landTP<0.999){

/* ============================================================
   WEBGL LENS STRIP — 歪みは画面中央に固定 / 枠は画像比率
============================================================ */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
let W=innerWidth,H=innerHeight;
const camera=new THREE.OrthographicCamera(0,W,H/2,-H/2,0.1,100);
camera.position.z=10;

const COPIES=5;
const N=WORKS.length*COPIES;
const MAG=1.0;             // 最大2.0x
const LEAD=800;            // 左側の余裕
let BASE_H,GAP,RADIUS,TOTAL;
const widths=new Array(N),offs=new Array(N);
function measure(){
  W=innerWidth;H=innerHeight;
  BASE_H=clamp(H*0.115,66,118);
  GAP=Math.round(BASE_H*0.45);   // 画像間の余白を広めに(参考動画寄り)
  let x=0;
  for(let i=0;i<N;i++){
    const w=WORKS[i%WORKS.length];
    widths[i]=BASE_H*w.asp;      // 画像の比率どおりの枠
    offs[i]=x;
    x+=widths[i]+GAP;
  }
  TOTAL=x;
  RADIUS=(BASE_H*1.27+GAP)*1.9;
  renderer.setSize(W,H);
  camera.right=W;camera.top=H/2;camera.bottom=-H/2;
  camera.updateProjectionMatrix();
}
measure();

/* 初期位置: Cloud Chair を中央(レンズ位置)に置く(最初の1回だけ) */
function centerOn(slug){
  const wi=WORKS.findIndex(w=>w.slug===slug);
  const j=Math.floor(COPIES/2)*WORKS.length+(wi<0?0:wi);
  const target=W/2+LEAD-widths[j]/2;
  return offs[j]-target;
}

const vert=`
uniform float uX;
uniform float uSW;
uniform float uSH;
uniform float uFocal;
uniform float uR;
uniform float uA;
uniform float uAmp;      // 動きの強さ 0..1
uniform float uTime;
uniform float uW;        // 画面幅
varying vec2 vUv;
varying float vB;
void main(){
  vUv=uv;
  float lx=position.x*uSW;
  float ly=position.y*uSH;
  float wx=uX+lx;
  float d=(wx-uFocal)/uR;
  float bump=exp(-d*d*2.6);                    // さらに鋭い減衰=強い緩急
  float deriv=1.0+uA*bump;
  float disp=uA*uR*0.55*tanh(d*1.45);
  float nx=wx+disp;
  float ny=ly*deriv;
  /* ガラスの揺らぎ: 流動感を抑えてキレ重視。
     振幅を半分以下に、静止時はほぼゼロ、動きへの反応と減衰を速く */
  float shoulder=bump*(1.0-bump)*4.0;
  float shim=shoulder*(0.05+0.95*uAmp);
  nx+=sin(ly*0.11+uTime*3.2)*shim*1.8;
  ny+=sin(nx*0.024+uTime*2.8)*shim*1.8;
  vB=shim;
  gl_Position=projectionMatrix*viewMatrix*vec4(nx,ny,1.0+uA*bump,1.0);
}`;
const frag=`
precision highp float;
uniform sampler2D uTex;
uniform float uHasTex;
uniform float uOp;
varying vec2 vUv;
varying float vB;
void main(){
  vec3 col;
  float ab=vB*0.012;
  if(uHasTex>0.5){
    col.r=texture2D(uTex,vUv+vec2(ab,0.0)).r;
    col.g=texture2D(uTex,vUv).g;
    col.b=texture2D(uTex,vUv-vec2(ab,0.0)).b;
  }else{
    col=vec3(0.95);
  }
  gl_FragColor=vec4(col,uOp);
}`;

const texLoader=new THREE.TextureLoader();
const meshes=[];
const geo=new THREE.PlaneGeometry(1,1,32,16);
for(let i=0;i<N;i++){
  const w=WORKS[i%WORKS.length];
  const mat=new THREE.ShaderMaterial({
    vertexShader:vert,fragmentShader:frag,transparent:true,
    uniforms:{
      uTex:{value:null},uHasTex:{value:0},
      uX:{value:0},uSW:{value:widths[i]},uSH:{value:BASE_H},
      uFocal:{value:W/2},uR:{value:RADIUS},uA:{value:0},
      uAmp:{value:0},uTime:{value:0},uW:{value:W},
      uOp:{value:0}
    }
  });
  const m=new THREE.Mesh(geo,mat);
  m.frustumCulled=false;
  m.userData={slug:w.slug,title:w.title};
  scene.add(m);meshes.push(m);
}
WORKS.forEach((w,wi)=>{
  texLoader.load(w.thumb,tex=>{
    tex.minFilter=THREE.LinearFilter;
    for(let c=0;c<COPIES;c++){
      const m=meshes[c*WORKS.length+wi];
      m.material.uniforms.uTex.value=tex;
      m.material.uniforms.uHasTex.value=1;
    }
    progress();
  },undefined,()=>progress());
});

addEventListener('resize',()=>{measure();meshes.forEach((m,i)=>{
  const u=m.material.uniforms;
  u.uSW.value=widths[i];u.uSH.value=BASE_H;
  u.uR.value=RADIUS;u.uW.value=W;
});});

/* ---------------- interaction (横移動はドラッグのみ) ---------------- */
let scroll=centerOn('cloud-chair'),tScroll=scroll,vel=0;
let lensA=0;
let dragging=false,dragged=false,sx=0,ss=0;

const press=e=>{
  if(!landingActive()||!onWorks())return;        // ワーク面でのみ
  dragging=true;dragged=false;
  sx=(e.touches?e.touches[0]:e).clientX;ss=tScroll;
  canvas.classList.add('grabbing');
};
const move=e=>{
  if(!dragging)return;
  const cx=(e.touches?e.touches[0]:e).clientX;
  if(Math.abs(cx-sx)>6)dragged=true;
  tScroll=ss-(cx-sx)*1.1;                          // クリックしながら横移動
};
const release=()=>{dragging=false;canvas.classList.remove('grabbing');setTimeout(()=>dragged=false,60);};
canvas.addEventListener('mousedown',press);
addEventListener('mousemove',move);
addEventListener('mouseup',release);
canvas.addEventListener('touchstart',press,{passive:true});
canvas.addEventListener('touchmove',move,{passive:true});
addEventListener('touchend',release);

canvas.addEventListener('click',e=>{
  if(dragged||!onWorks())return;
  const A=lensA,R=RADIUS,f=W/2;
  let wx=e.clientX;
  for(let k=0;k<6;k++){
    const d=(wx-f)/R;
    const g=wx+A*R*0.886*Math.tanh(d*0.9)-e.clientX;
    const gd=1+A*Math.exp(-d*d)*0.8;
    wx-=g/gd;
  }
  const s=((wx+scroll+LEAD)%TOTAL+TOTAL)%TOTAL;
  for(let i=0;i<N;i++){
    if(s>=offs[i]&&s<offs[i]+widths[i]+GAP){
      location.hash='#/work/'+meshes[i].userData.slug;
      return;
    }
  }
});

/* ---------------- render loop ---------------- */
const focusTitle=document.getElementById('focusTitle');
const clock=new THREE.Clock();
let amp=0,motion=0;
addEventListener('mousemove',e=>{motion=Math.min(motion+Math.abs(e.movementX||0)*0.02,1);});
function frame(){
  requestAnimationFrame(frame);
  if(!landingActive())return;

  // 縦スクロール状態を滑らかに反映し、CSS変数 --p を更新
  landP=lerp(landP,landTP,0.11);
  if(Math.abs(landP-landTP)<0.001)landP=landTP;
  landing.style.setProperty('--p',landP.toFixed(4));
  // ワーク定着判定: 完全に到達して少し経つまで横送りを無効化
  if(landP>0.985&&landTP>=0.999){
    if(!worksSettled&&settleTimer==null){
      settleTimer=setTimeout(()=>{worksSettled=true;settleTimer=null;},420);
    }
  }else{
    worksSettled=false;
    if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
  }

  const t=clock.getElapsedTime();
  const prev=scroll;
  scroll=lerp(scroll,tScroll,0.055);
  vel=lerp(vel,(scroll-prev),0.08);
  /* 動きの強さ: 反応も減衰も速め(キレ重視) */
  motion*=0.88;
  amp=lerp(amp,clamp(Math.abs(vel)*0.12+motion,0,1),0.22);
  const focalX=W/2;                              // 中央固定

  let op=1;
  if(introStart){
    const k=clamp((performance.now()-introStart)/1400,0,1);
    op=k;
    lensA=lerp(0,MAG,1-Math.pow(1-k,3));
  }else{op=0;lensA=0;}
  if(reduced){lensA=0;op=introStart?1:0;}

  let best=1e9,bestTitle='',bestB=0;
  for(let i=0;i<N;i++){
    const m=meshes[i];
    let x=((offs[i]-scroll)%TOTAL+TOTAL)%TOTAL-LEAD;
    const u=m.material.uniforms;
    if(x<-widths[i]-600||x>W+600){m.visible=false;continue;}
    m.visible=true;
    u.uX.value=x+widths[i]/2;
    u.uFocal.value=focalX;
    u.uA.value=lensA;
    u.uAmp.value=amp;
    u.uTime.value=t;
    u.uOp.value=op;
    const dist=Math.abs(x+widths[i]/2-focalX);
    if(dist<best){best=dist;bestTitle=m.userData.title;bestB=Math.exp(-Math.pow(dist/RADIUS,2));}
  }

  if(bestTitle&&lensA>0.1){
    focusTitle.textContent=bestTitle;
    focusTitle.style.left=focalX+'px';
    focusTitle.style.top=(H/2+BASE_H*(1+lensA)/2+16)+'px';
    focusTitle.style.opacity=String(clamp(bestB,0,1)*op);
  }else focusTitle.style.opacity='0';

  renderer.render(scene,camera);
}
frame();

    <section class="plate p-next">
      <a href="#/work/${prev.slug}"><span class="lbl">Prev</span><span class="t">${prev.title}</span></a>
      <a href="#/work/${next.slug}"><span class="lbl">Next</span><span class="t">${next.title}</span></a>
    </section>`;
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}

  const V=[];
  for(let s=0;s<NSUB;s++){
    const a=new Uint8Array(GW*GH);
    for(let i=0;i<GW*GH;i++)a[i]=RAW.charCodeAt(s*GW*GH+i);
    V.push(a);
  }

  const wrap=document.getElementById('specwrap');
  const cv=document.getElementById('bee');
  const ctx=cv.getContext('2d');
  const mobile=matchMedia('(max-width:640px)').matches;
  const STRIDE=mobile?2:1;
  let BW=0,BH=0,DPR=1,CS=0,vig=null;

  /* 柔らかいスプラット(事前描画スプライト) */
  const SPR=document.createElement('canvas');
  SPR.width=SPR.height=64;
  {
    const c=SPR.getContext('2d');
    const g=c.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(238,234,226,1)');
    g.addColorStop(0.45,'rgba(238,234,226,0.55)');
    g.addColorStop(1,'rgba(238,234,226,0)');
    c.fillStyle=g;c.fillRect(0,0,64,64);
  }

  /* 粒の生成(全被写体で値ゼロのセルは捨てる) */
  const P=[];
  for(let gy=0;gy<GH;gy+=STRIDE){
    for(let gx=0;gx<GW;gx+=STRIDE){
      const i=gy*GW+gx;
      if(Math.max(V[0][i],V[1][i],V[2][i])<8)continue;
      P.push({
        gx,gy,i,
        jx:(Math.random()-0.5)*0.7,
        jy:(Math.random()-0.5)*0.7,
        ph:Math.random()*6.28,
        sp:0.5+Math.random()
      });
    }
  }

  function sizeBox(){
    DPR=Math.min(devicePixelRatio,mobile?1.5:1.75);
    BW=wrap.clientWidth;BH=wrap.clientHeight;
    cv.width=BW*DPR;cv.height=BH*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CS=BW/GW;
    ctx.fillStyle='#0D0C0B';ctx.fillRect(0,0,BW,BH);
    vig=ctx.createRadialGradient(BW/2,BH/2,BH*0.45,BW/2,BH/2,BW*0.62);
    vig.addColorStop(0,'rgba(8,8,7,0)');
    vig.addColorStop(1,'rgba(8,8,7,0.6)');
  }
  sizeBox();
  addEventListener('resize',sizeBox);

  /* ---- 状態: 被写体の切替(粘性の滲み) ---- */
  let cur=0,nxt=1,trans=null,lastSwitch=performance.now()+3000;
  function frontNoise(gx,gy,s){ // 空間的に連続な波(縁のヌメり)
    return (Math.sin(gx*0.33+s)+Math.sin(gy*0.47+s*1.7)+Math.sin((gx+gy)*0.21+s*2.3))/3;
  }
  function startTrans(bx,by){ // box座標で開始点
    nxt=(cur+1)%NSUB;
    trans={
      sx:bx/CS, sy:by/CS,          // グリッド座標
      R:-4,
      band:GW*0.26,
      seed:Math.random()*100
    };
    lastSwitch=performance.now();
  }

  /* ---- マウス ---- */
  let mx=-9999,my=-9999,smx=-9999,smy=-9999,inBox=false;
  function boxPos(cx,cy){
    const r=cv.getBoundingClientRect();
    return [cx-r.left,cy-r.top,cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom];
  }
  addEventListener('mousemove',e=>{
    if(!landingActive())return;
    const[bx,by,inside]=boxPos(e.clientX,e.clientY);
    mx=bx;my=by;inBox=inside;
    if(inside&&!trans&&performance.now()-lastSwitch>6000)startTrans(bx,by);
  });
  cv.addEventListener('touchstart',e=>{
    const t=e.touches[0];if(!t)return;
    const[bx,by,inside]=boxPos(t.clientX,t.clientY);
    if(inside&&!trans&&performance.now()-lastSwitch>4000)startTrans(bx,by);
  },{passive:true});

  function heroFrame(t){
    requestAnimationFrame(heroFrame);
    if(!landingActive())return;
    if(!finished)return;
    if(cv.width===0||BW===0||wrap.clientWidth!==BW){sizeBox();}

    /* カーソル慣性追従 */
    if(smx<-9000){smx=mx;smy=my;}
    smx+=(mx-smx)*0.065;smy+=(my-smy)*0.065;

    /* 残像つきの地 */
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(13,12,11,0.5)';
    ctx.fillRect(0,0,BW,BH);

    /* 自動切替 */
    if(!trans&&performance.now()-lastSwitch>14000){
      startTrans(Math.random()*BW,Math.random()*BH);
    }
    /* 滲みの前進(粘性: 進むほど遅く) */
    let R=0,band=0;
    if(trans){
      const target=Math.hypot(GW,GH)+trans.band*1.5;
      trans.R+=(target-trans.R)*0.018+0.12;
      R=trans.R;band=trans.band;
      if(trans.R>=target-1){cur=nxt;trans=null;}
    }

    const wander_x=Math.sin(t*0.00031)*4+Math.sin(t*0.00017+2)*2.5;
    const wander_y=Math.cos(t*0.00041)*3;

    /* ---- 粒 ---- */
    for(const p of P){
      let v0=V[cur][p.i]/255;
      let v=v0;
      let wx=0,wy=0,glow=0;
      if(trans){
        const dd=Math.hypot(p.gx-trans.sx,p.gy-trans.sy);
        const n=frontNoise(p.gx,p.gy,trans.seed)*band*0.85;
        let m=(R-dd+n)/band;
        m=m<0?0:(m>1?1:m);
        m=m*m*(3-2*m);
        const v1=V[nxt][p.i]/255;
        v=v0+(v1-v0)*m;
        /* 前線の歪み(ヌメり): 通過帯だけ径方向+接線方向にうねる */
        const w=m*(1-m)*4;
        if(w>0.02){
          const a=Math.atan2(p.gy-trans.sy,p.gx-trans.sx);
          const wob=Math.sin(t*0.004+p.gx*0.31+p.gy*0.27+trans.seed);
          wx=(Math.cos(a)*1.6+Math.cos(a+1.57)*wob)*w*CS*1.6;
          wy=(Math.sin(a)*1.6+Math.sin(a+1.57)*wob)*w*CS*1.6;
          glow=w*0.22;
        }
      }
      if(v<0.03&&glow<0.02)continue;

      const flick=0.85+0.15*Math.sin(t*0.0013*p.sp*4+p.ph);
      let x=(p.gx+0.5+p.jx)*CS+wander_x+wx;
      let y=(p.gy+0.5+p.jy)*CS*1.042+wander_y+wy;

      /* レンズ歪み: カーソル周辺を凸レンズ状に押し広げる */
      if(inBox){
        const dx=x-smx,dy=y-smy;
        const dq=dx*dx+dy*dy;
        const R2=90000;
        if(dq<R2){
          const ratio=dq/R2;
          const f=(1-ratio)*(1-ratio)*28;
          x+=dx*f;y+=dy*f;
        }
      }

      const vv=Math.min(1,v*flick+glow);
      const sz=CS*(0.55+vv*1.35);          // 粒を細かく
      ctx.globalAlpha=0.14+0.78*vv;
      ctx.drawImage(SPR,x-sz/2,y-sz/2,sz,sz);
    }

    /* ---- フィルムグレイン(mono retro photo) ---- */
    ctx.globalAlpha=1;
    for(let i=0;i<(mobile?90:240);i++){
      const a=Math.random();
      ctx.fillStyle=a<0.7?`rgba(232,228,220,${0.02+Math.random()*0.05})`
                         :`rgba(0,0,0,${0.04+Math.random()*0.08})`;
      ctx.fillRect(Math.random()*BW,Math.random()*BH,1,1);
    }
    /* 周縁の落ち込み */
    ctx.fillStyle=vig;
    ctx.fillRect(0,0,BW,BH);
  }
  requestAnimationFrame(heroFrame);
})();

/* ============================================================
   ABOUT — カエルの足跡(下辺→右辺へ扇状にペタペタ歩く)
============================================================ */
(function(){
  const layer=document.getElementById('frogtrail');
  if(!layer)return;
  const FROG_L='/img/img-33.avif';
  const FROG_R='/img/img-34.avif';

  const W=320,H=320;
  layer.style.width=W+'px';layer.style.height=H+'px';

  /* 弧: 右下の外側を中心に、画面下(左下)から右辺(右上)へ甲を描く四分円。
     最初の足跡と画面下端の余白 = 最後の足跡と画面右端の余白 になるよう配置 */
  const MARGIN=40;                 // 共通の余白(右端=下端)
  const cx=W-MARGIN, cy=H-MARGIN;  // 弧の中心(余白分だけ内側)
  const R=W-MARGIN*2;              // 半径
  const a0=Math.PI, a1=Math.PI*1.5; // 開始=真下方向(下端) → 終了=真右方向(右端)
  const N=11;
  const steps=[];
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    const ang=a0+(a1-a0)*t;
    const px=cx+Math.cos(ang)*R;
    const py=cy+Math.sin(ang)*R;
    const tang=ang+Math.PI/2;
    const deg=tang*180/Math.PI;
    const side=(i%2)?1:-1;
    const nx=Math.cos(ang)*side*9;
    const ny=Math.sin(ang)*side*9;
    steps.push({x:px+nx, y:py+ny, foot:i%2, deg});
  }

  let timers=[],prints=[];
  function clearAll(){timers.forEach(clearTimeout);timers=[];layer.innerHTML='';prints=[];}
  function walk(){
    clearAll();
    const STEP=640;                 // ペタ…ペタ…の間隔
    const TAIL=3;                   // 後ろ何歩分を残して消し始めるか
    steps.forEach((s,i)=>{
      timers.push(setTimeout(()=>{
        const img=document.createElement('img');
        img.src=s.foot?FROG_R:FROG_L;
        img.style.cssText='position:absolute;width:26px;height:26px;left:'+s.x+'px;top:'+s.y+'px;'+
          'transform:translate(-50%,-50%) rotate('+s.deg+'deg) scale(.4);opacity:0;'+
          'transition:opacity .6s ease, transform .3s cubic-bezier(.34,1.56,.64,1);';
        layer.appendChild(img);prints.push(img);
        requestAnimationFrame(()=>{
          img.style.opacity='0.9';
          img.style.transform='translate(-50%,-50%) rotate('+s.deg+'deg) scale(1)';
        });
        // 歩きながら、TAIL歩うしろの足跡を消していく
        const old=prints[i-TAIL];
        if(old)old.style.opacity='0';
      }, 700+i*STEP));
    });
    // 残っている最後のTAIL歩も順番に消す
    const walkEnd=700+N*STEP;
    for(let k=0;k<TAIL;k++){
      timers.push(setTimeout(()=>{
        const idx=N-TAIL+k;
        if(prints[idx])prints[idx].style.opacity='0';
      }, walkEnd+k*STEP));
    }
    timers.push(setTimeout(walk, walkEnd+TAIL*STEP+1400));
  }
  const mo=new MutationObserver(()=>{
    if(views.about.classList.contains('active')){if(!layer.dataset.on){layer.dataset.on='1';walk();}}
    else{layer.dataset.on='';clearAll();}
  });
  mo.observe(views.about,{attributes:true,attributeFilter:['class']});
})();

/* ============================================================
   CONTACT — てんとう虫が画面の端を歩く(緩やかカーブ / 中央フォーム回避)
============================================================ */
(function(){
  const bug=document.getElementById('ladybug');
  if(!bug)return;
  const NF=24, NAT=-Math.PI/2, M=70;
  let x,y,heading,tHeading,speed,fPhase=0,fi=0,respawnAt=0,started=false,firstSpawn=true;

  function active(){return views.contact.classList.contains('active');}
  function inForbidden(px,py){
    const fw=Math.min(420,innerWidth*0.5), fh=Math.min(560,innerHeight*0.7);
    return Math.abs(px-innerWidth/2)<fw/2 && Math.abs(py-innerHeight/2)<fh/2;
  }
  function edgeGoal(){
    for(let k=0;k<30;k++){
      const gx=Math.random()*innerWidth, gy=Math.random()*innerHeight;
      const edge=gx<innerWidth*0.22||gx>innerWidth*0.78||gy<innerHeight*0.2||gy>innerHeight*0.8;
      if(edge&&!inForbidden(gx,gy))return [gx,gy];
    }
    return [innerWidth*0.1, innerHeight*0.9];
  }
  function spawn(){
    if(firstSpawn){ x=innerWidth+M; y=innerHeight*0.86; firstSpawn=false; }
    else{
      const s=Math.floor(Math.random()*4);
      if(s===0){x=-M;y=Math.random()*innerHeight;}
      else if(s===1){x=innerWidth+M;y=Math.random()*innerHeight;}
      else if(s===2){x=Math.random()*innerWidth;y=-M;}
      else {x=Math.random()*innerWidth;y=innerHeight+M;}
    }
    const [gx,gy]=edgeGoal();
    heading=tHeading=Math.atan2(gy-y,gx-x); speed=0;
    bug.style.transition='none';
    bug.style.setProperty('--lx',x.toFixed(1)+'px');
    bug.style.setProperty('--ly',y.toFixed(1)+'px');
    bug.style.setProperty('--lr',((heading-NAT)*180/Math.PI).toFixed(2)+'deg');
    // 位置確定後に表示(中央からのストリーク防止)
    bug.getBoundingClientRect();
    bug.classList.add('live');
  }

  let last=performance.now();
  function loop(t){
    requestAnimationFrame(loop);
    if(!active()){started=false;bug.classList.remove('live');return;}
    if(!started){started=true;spawn();last=t;}
    const dt=Math.min(50,t-last); last=t;
    if(respawnAt){ if(t>=respawnAt){respawnAt=0;spawn();} else return; }

    const ahead=120;
    if(inForbidden(x+Math.cos(heading)*ahead, y+Math.sin(heading)*ahead)){
      const away=Math.atan2(y-innerHeight/2, x-innerWidth/2);
      tHeading=away+(Math.random()-0.5)*0.6;
    }
    let dh=Math.atan2(Math.sin(tHeading-heading),Math.cos(tHeading-heading));
    dh=Math.max(-0.012,Math.min(0.012,dh));
    heading+=dh;
    speed+=(0.34-speed)*0.04;
    x+=Math.cos(heading)*speed*dt*0.06;
    y+=Math.sin(heading)*speed*dt*0.06;

    if(x<-M||x>innerWidth+M||y<-M||y>innerHeight+M){
      respawnAt=t+1000+Math.random()*2600;
      bug.classList.remove('live');
      bug.style.transition='none';
      bug.style.setProperty('--lx','-9999px');
      return;
    }
    bug.style.transition='';

    // スプライトシートのコマ送り(デコード待ちゼロ=カクつかない)
    fPhase += speed*dt*0.06 * 0.72;
    while(fPhase>=1){ fPhase-=1; fi=(fi+1)%NF; }
    bug.style.setProperty('--f',fi);

    const deg=(heading - NAT)*180/Math.PI;
    bug.style.setProperty('--lr',deg.toFixed(2)+'deg');
    bug.style.setProperty('--lx',x.toFixed(1)+'px');
    bug.style.setProperty('--ly',y.toFixed(1)+'px');
  }
  requestAnimationFrame(loop);
})();

/* ============================================================
   ROUTER
============================================================ */
let first=true;
function route(){
  const h=location.hash||'#/';
  let target='landing';
  if(h.startsWith('#/work/'))target='work';
  else if(h.startsWith('#/about'))target='about';
  else if(h.startsWith('#/contact'))target='contact';
  const apply=()=>{
    Object.values(views).forEach(v=>v.classList.remove('active'));
    if(target==='work')renderWork(h.split('/')[2]);
    views[target].classList.add('active');
    document.querySelectorAll('[data-go]').forEach(a=>a.classList.toggle('on',a.dataset.go===target));
    // ロゴ(Eito)からトップに戻ったらハチ画面へリセット
    if(target==='landing'&&h==='#/'&&!first){
      landTP=0;
      scroll=tScroll=centerOn('cloud-chair');vel=0;
      worksSettled=false;
      if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
    }
    scrollTo(0,0);
    first=false;
    app.classList.remove('fading');
  };
  if(first||reduced){apply();return;}
  app.classList.add('fading');
  setTimeout(apply,280);
}
addEventListener('hashchange',route);
route();
})();
